<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Irontronics — Scan a metal part, cut it again</title>
    <meta name="description" content="Irontronics turns a top-down photo of a flat metal part into a calibrated, editable profile and exports G-code, DXF, and SVG." />
    <meta name="theme-color" content="#f3f3f6" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta property="og:title" content="Irontronics" />
    <meta property="og:description" content="Photo of a metal part in, calibrated profile and G-code out." />
    <meta property="og:image" content="/icon-512.png" />
    <link rel="preload" href="/fonts/geist-sans-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face { font-family: 'Geist Boot'; font-weight: 600; font-display: swap; src: url('/fonts/geist-sans-latin-600-normal.woff2') format('woff2'); }
      /* Boot screen: painted before any script runs, removed once the app has mounted. */
      #boot {
        position: fixed; inset: 0; z-index: 1000;
        display: grid; place-items: center;
        background: #f3f3f6; color: #1c1c22;
        font: 500 15px/1 ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
        transition: opacity 200ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      #boot.done { opacity: 0; pointer-events: none; }
      #boot .b { display: flex; flex-direction: column; align-items: center; gap: 18px; }
      #boot .m { display: flex; align-items: center; gap: 10px; letter-spacing: -0.01em; font: 600 17px 'Geist Boot', ui-sans-serif, system-ui, sans-serif; }
      #boot .r { width: 132px; height: 2px; border-radius: 1px; background: #e5e5ea; overflow: hidden; opacity: 0; animation: bootin 200ms 400ms forwards; }
      #boot .r i { display: block; width: 36%; height: 100%; background: #5a5fe6; animation: bootrun 1.1s cubic-bezier(0.45, 0, 0.2, 1) infinite; }
      #boot .s { font-size: 11px; font-weight: 400; color: #74747e; letter-spacing: 0.02em; opacity: 0; animation: bootin 200ms 400ms forwards; }
      @keyframes bootrun { from { transform: translateX(-100%); } to { transform: translateX(280%); } }
      @keyframes bootin { to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { #boot .r i { animation: none; width: 100%; opacity: .5; } }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-live="polite">
      <div class="b">
        <div class="m">
          <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="5.5" fill="#5a5fe6"/><path d="M5 5.5H19V11.5H12.5V18.5H7.3L5 16.2Z" fill="#fff"/><circle cx="8.7" cy="9" r="1.55" fill="#5a5fe6"/></svg>
          Irontronics
        </div>
        <div class="r"><i></i></div>
        <div class="s" id="boot-msg">Loading</div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
